[providers.php]
Tell Nixpacks to install the PHP extensions directly as system packages
libs = ["php83Extensions.bcmath", "php83Extensions.gd", "php83Extensions.zip", "php83Extensions.dom", "php83Extensions.fileinfo"]

[build]
nixPkgs = ["php83", "php83Extensions.bcmath", "php83Extensions.pdo_mysql", "php83Extensions.gd"]

[phases.setup]
# Force the installation of pre-compiled alpine/nixos packages instead of compiling PHP from source
nixPkgs = [
  "php83",
  "php83Extensions.bcmath",
  "php83Extensions.gd",
  "php83Extensions.zip",
  "php83Extensions.dom",
  "php83Extensions.fileinfo",
  "composer"
]

[phases.install]
# Tell composer to ignore missing extension checks during build to prevent compilation triggers
cmds = ["composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs"]
[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm ci || npm install",
  "npm run build"
]

[phases.deploy]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache",
  "php artisan storage:link --force",
  "php artisan migrate --force"
]
