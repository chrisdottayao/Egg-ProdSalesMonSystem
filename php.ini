; Picked up by Nixpacks' PHP provider on Railway and merged into the runtime
; php.ini. Needed because the historical/bulk CSV importers (EggProduction,
; BuildingDaily, EggGradingDaily) accept files up to 10MB (Laravel-side
; max:10240 validation) — PHP's own upload_max_filesize/post_max_size must be
; at least that large or the upload is rejected/truncated before Laravel's
; validation ever runs, regardless of what the Laravel rule says.
upload_max_filesize = 12M
post_max_size = 15M

; The 5-year building_daily import (82k+ rows) takes longer than PHP's
; default 30s execution limit to parse + chunk-insert + roll up. Found via
; a real failed 5-year import (fatal timeout, not a validation error).
max_execution_time = 300

; Same import also exhausted the default 128M during real testing (~1,825
; distinct dates each triggering rollup + cache writes over one long-lived
; request). Matches XAMPP's local default, which never had this problem.
memory_limit = 512M
